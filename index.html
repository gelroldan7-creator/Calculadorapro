<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Multiherramienta Pro v1.2.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 870px;
      background-color: #000000;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid #222;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .bg-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1;
      pointer-events: none;
      transition: background 0.3s ease;
    }

    .app-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* BARRA SUPERIOR */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px 5px;
    }

    .nav-tabs {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .nav-btn, .top-action-btn {
      background: transparent;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 6px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .nav-btn svg, .top-action-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-btn.active { color: #ff9f0a; }

    .nav-right-actions {
      display: flex;
      gap: 10px;
    }

    /* VISTAS */
    .tab-view {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 10px 20px 20px;
      overflow-y: auto;
    }

    .tab-view.active { display: flex; }

    /* HISTORIAL EN PANTALLA PRINCIPAL */
    .history-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 10px 0;
      gap: 8px;
      overflow-y: auto;
      max-height: 180px;
    }

    .history-item { text-align: right; }
    .history-expr { font-size: 16px; color: #777; }
    .history-res { font-size: 18px; color: #aaa; font-weight: 500; }

    .main-display {
      font-size: 50px;
      font-weight: 300;
      text-align: right;
      margin-bottom: 15px;
      min-height: 60px;
      word-break: break-all;
    }

    /* TECLADO TIPO iOS */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      height: 68px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: filter 0.1s;
    }

    .btn:active { filter: brightness(1.3); }

    .btn-num { background: #333333; color: #ffffff; }
    .btn-action { background: #a5a5a5; color: #000000; font-weight: 600; }
    .btn-danger { background: #ff453a; color: #ffffff; font-weight: 600; }
    .btn-op { background: #ff9f0a; color: #ffffff; font-size: 28px; }
    .btn-equals { background: #ff9f0a; color: #ffffff; }

    /* CUADRÍCULA DE HERRAMIENTAS */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px 15px;
      padding-top: 20px;
    }

    .tool-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: center;
    }

    .tool-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff9f0a;
      background: #1c1c1e;
    }

    .tool-icon svg { width: 24px; height: 24px; fill: currentColor; }
    .tool-label { font-size: 13px; color: #aaa; }

    /* MODALES Y PANELES DESPLEGABLES */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 20;
    }

    .custom-modal {
      display: none;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #1c1c1e;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      z-index: 30;
      border-top: 1px solid #333;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
      max-height: 85%;
      overflow-y: auto;
    }

    .custom-modal.active, .modal-overlay.active { display: block; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title { font-size: 18px; font-weight: 600; color: #ff9f0a; }
    .close-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }

    /* FORMULARIOS DE HERRAMIENTAS */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #2c2c2e;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .form-control:focus { border-color: #ff9f0a; }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ff9f0a;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .tool-result-box {
      margin-top: 15px;
      padding: 12px;
      background: #2c2c2e;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      color: #30d158;
      font-weight: 600;
    }

    .file-input-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #ff9f0a;
      color: #fff;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .range-slider { width: 100%; accent-color: #ff9f0a; }

    .reset-btn {
      width: 100%;
      padding: 10px;
      background: #2c2c2e;
      border: none;
      color: #ff453a;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
    }

    .version-info {
      background: #2c2c2e;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #aaa;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>

  <!-- LIBRERÍAS DE FIREBASE (Compatibilidad v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="app-container" id="appContainer">
    <div class="bg-overlay" id="bgOverlay"></div>
<div class="app-content">
      <!-- BARRA NAVEGACIÓN SUPERIOR -->
      <div class="top-nav">
        <div class="nav-tabs">
          <button class="nav-btn active" onclick="switchTab('calcView', this)">
            <svg viewBox="0 0 24 24"><path d="M19,3H5C3.9,3,3,3.9,3,5v14c0,1.1,0.9,2,2,2h14c1.1,0,2-0.9,2-2V5C21,3.9,20.1,3,19,3z M7,7h2v2H7V7z M7,11h2v2H7V11z M7,15h2v2H7V15z M17,17h-6v-2h6V17z M17,13h-2v-2h2V13z M17,9h-2V7h2V9z"/></svg>
          </button>
          <button class="nav-btn" onclick="switchTab('toolsView', this)">
            <svg viewBox="0 0 24 24"><path d="M4,11h6V5H4V11z M4,19h6v-6H4V19z M14,19h6v-6h-6V19z M14,5v6h6V5H14z"/></svg>
          </button>
          <button class="nav-btn" onclick="switchTab('financeView', this)">
            <svg viewBox="0 0 24 24"><path d="M10,20v-6h4v6h5v-8h3L12,3L2,12h3v8H10z"/></svg>
          </button>
        </div>

        <div class="nav-right-actions">
          <button class="top-action-btn" onclick="openFullHistory()">
            <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7.07 7.07 0 0 1-6-3.4L5.5 17A8.93 8.93 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
          </button>
          <button class="top-action-btn" onclick="openModal('customModal')">
            <svg viewBox="0 0 24 24"><path d="M12,16A2,2 0 0,1 14,18A2,2 0 0,1 12,20A2,2 0 0,1 10,18A2,2 0 0,1 12,16M12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12A2,2 0 0,1 12,10M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4Z"/></svg>
          </button>
        </div>
      </div>

      <!-- VISTA 1: CALCULADORA -->
      <div id="calcView" class="tab-view active">
        <div class="history-display" id="historyList"></div>
        <div class="main-display" id="display">0</div>

        <div class="keypad">
          <button class="btn btn-action" onclick="clearCurrent()">C</button>
          <button class="btn btn-danger" onclick="clearAllHistory()">AC</button>
          <button class="btn btn-action" onclick="deleteLast()">⌫</button>
          <button class="btn btn-op" onclick="appendOp('/')">÷</button>

          <button class="btn btn-num" onclick="appendNum('7')">7</button>
          <button class="btn btn-num" onclick="appendNum('8')">8</button>
          <button class="btn btn-num" onclick="appendNum('9')">9</button>
          <button class="btn btn-op" onclick="appendOp('*')">×</button>

          <button class="btn btn-num" onclick="appendNum('4')">4</button>
          <button class="btn btn-num" onclick="appendNum('5')">5</button>
          <button class="btn btn-num" onclick="appendNum('6')">6</button>
          <button class="btn btn-op" onclick="appendOp('-')">-</button>

          <button class="btn btn-num" onclick="appendNum('1')">1</button>
          <button class="btn btn-num" onclick="appendNum('2')">2</button>
          <button class="btn btn-num" onclick="appendNum('3')">3</button>
          <button class="btn btn-op" onclick="appendOp('+')">+</button>

          <button class="btn btn-num" onclick="appendOp('%')">%</button>
          <button class="btn btn-num" onclick="appendNum('0')">0</button>
          <button class="btn btn-num" onclick="appendNum(',')">,</button>
          <button class="btn btn-equals" onclick="calculate()">=</button>
        </div>
      </div>

      <!-- VISTA 2: CONVERSORES DE UNIDADES -->
      <div id="toolsView" class="tab-view">
        <div class="tools-grid">
          <div class="tool-item" onclick="openToolModal('edad')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12,6A3,3 0 0,0 9,9A3,3 0 0,0 12,12A3,3 0 0,0 15,9A3,3 0 0,0 12,6M6,15H18V13H6V15Z"/></svg></div><span class="tool-label">Edad</span></div>
          <div class="tool-item" onclick="openToolModal('area')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19Z"/></svg></div><span class="tool-label">Área</span></div>
          <div class="tool-item" onclick="openToolModal('imc')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/></svg></div><span class="tool-label">IMC</span></div>
          <div class="tool-item" onclick="openToolModal('datos')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M17,3H7A2,2 0 0,0 5,5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V5A2,2 0 0,0 17,3Z"/></svg></div><span class="tool-label">Datos</span></div>
          <div class="tool-item" onclick="openToolModal('descuento')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12.79,21L3,11.21V3H11.21L21,12.79L12.79,21Z"/></svg></div><span class="tool-label">Descuento</span></div>
          <div class="tool-item" onclick="openToolModal('massa')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12,3A4,4 0 0,1 16,7C16,7.73 15.8,8.41 15.46,9H18A2,2 0 0,1 20,11V19A2,2 0 0,1 18,21H6A2,2 0 0,1 4,19V11A2,2 0 0,1 6,9H8.54C8.2,8.41 8,7.73 8,7A4,4 0 0,1 12,3Z"/></svg></div><span class="tool-label">Masa</span></div>
          <div class="tool-item" onclick="openToolModal('sistemas')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M7,5H9V19H7V5M15,5H17V19H15V5Z"/></svg></div><span class="tool-label">Sistemas</span></div>
          <div class="tool-item" onclick="openToolModal('temperatura')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M15,13V5A3,3 0 0,0 9,5V13A5,5 0 1,0 15,13Z"/></svg></div><span class="tool-label">Temperatura</span></div>
          <div class="tool-item" onclick="openToolModal('volume')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12,3L2,12H5V20H19V12H22L12,3Z"/></svg></div><span class="tool-label">Volumen</span></div>
        </div>
      </div>

      <!-- VISTA 3: FINANZAS -->
      <div id="financeView" class="tab-view">
        <div class="tools-grid">
          <div class="tool-item" onclick="openToolModal('gst')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3Z"/></svg></div><span class="tool-label">GST/Impuesto</span></div>
          <div class="tool-item" onclick="openToolModal('moeda')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,17A5,5 0 0,1 7,12A5,5 0 0,1 17,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17Z"/></svg></div><span class="tool-label">Moneda</span></div>
          <div class="tool-item" onclick="openToolModal('prestamo')"><div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/></svg></div><span class="tool-label">Préstamo</span></div>
        </div>
      </div>
    </div>

    <!-- MODAL OSCURO GLOBAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeAllModals()"></div>

    <!-- MODAL HISTORIAL COMPLETO -->
    <div class="custom-modal" id="fullHistoryModal">
      <div class="modal-header">
        <span class="modal-title">Historial de Operaciones</span>
        <button class="close-btn" onclick="closeAllModals()">✕</button>
      </div>
      <div id="fullHistoryContainer" style="display: flex; flex-direction: column; gap: 12px; max-height: 350px; overflow-y: auto;"></div>
      <button class="reset-btn" style="margin-top:20px;" onclick="clearAllHistory(); closeAllModals();">Vaciar Historial</button>
    </div>

    <!-- MODAL PERSONALIZAR Y AJUSTES -->
    <div class="custom-modal" id="customModal">
      <div class="modal-header">
        <span class="modal-title">Ajustes del Sistema</span>
        <button class="close-btn" onclick="closeAllModals()">✕</button>
      </div>
      
      <div class="form-group">
        <label>Imagen de Fondo</label>
        <label for="bgUploader" class="file-input-btn">Seleccionar Imagen</label>
        <input type="file" id="bgUploader" accept="image/*" style="display:none" onchange="uploadBackground(event)">
      </div>

      <div class="form-group">
        <label>Opacidad del Fondo</label>
        <input type="range" class="range-slider" min="0" max="0.95" step="0.05" value="0.85" oninput="changeOverlayOpacity(this.value)">
      </div>

      <button class="reset-btn" style="margin-bottom:15px;" onclick="resetCustomization()">Restablecer Fondo Predeterminado</button>

      <!-- MÓDULO DE ACTUALIZACIONES -->
      <div class="version-info">
        <div>
          <strong style="color:#fff;">Versión de la App</strong><br>
          <span id="appVersionLabel">v1.2.0 (Última)</span>
        </div>
        <button class="btn-submit" style="width:auto; padding: 6px 12px; margin:0; font-size:12px;" onclick="checkUpdates()">Buscar Actualización</button>
      </div>
    </div>

    <!-- MODAL DE HERRAMIENTAS DINÁMICAS -->
    <div class="custom-modal" id="toolRunnerModal">
      <div class="modal-header">
        <span class="modal-title" id="toolTitle">Herramienta</span>
        <button class="close-btn" onclick="closeAllModals()">✕</button>
      </div>
      <div id="toolBody"></div>
    </div>

  </div>

  <script>
    // CONFIGURACIÓN E INICIALIZACIÓN DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyC4qlQgX0TAmY5HP4z0Zu24gPYNENiB7sY",
      authDomain: "calculadora-pro-2c4c7.firebaseapp.com",
      databaseURL: "https://calculadora-pro-2c4c7-default-rtdb.firebaseio.com",
      projectId: "calculadora-pro-2c4c7",
      storageBucket: "calculadora-pro-2c4c7.firebasestorage.app",
      messagingSenderId: "152498762183",
      appId: "1:152498762183:web:65ae928e6a5300e10229e2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let currentInput = "0";
    let historyMemory = [];
    const APP_VERSION = "1.2.0";
    const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.tuusuario.calculadorapro"; // Enlace a Google Play

    function switchTab(viewId, btnElement) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      btnElement.classList.add('active');
    }

    function updateDisplay() {
      document.getElementById('display').innerText = currentInput;
    }

    function appendNum(num) {
      if (currentInput === "0" && num !== ',') {
        currentInput = num;
      } else {
        currentInput += num;
      }
      updateDisplay();
    }

    function appendOp(op) {
      currentInput += " " + op + " ";
      updateDisplay();
    }

    function clearCurrent() {
      currentInput = "0";
      updateDisplay();
    }

    function clearAllHistory() {
      currentInput = "0";
      historyMemory = [];
      document.getElementById('historyList').innerHTML = "";
      updateDisplay();
    }

    function deleteLast() {
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = "0";
      }
      updateDisplay();
    }

    // LÓGICA DE REDONDEO INTELIGENTE (HASTA 2 DECIMALES)
    function calculate() {
      try {
        let rawExpr = currentInput;
        let expr = currentInput.replace(/,/g, '.').replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
        let rawRes = eval(expr);

        // Redondear a máximo 2 decimales si es necesario
        let roundedRes = Math.round((rawRes + Number.EPSILON) * 100) / 100;
        let formattedRes = roundedRes.toString().replace(/\./g, ',');

        historyMemory.push({ expr: rawExpr, res: formattedRes });
        renderHistory();

        currentInput = formattedRes;
        updateDisplay();
      } catch (e) {
        currentInput = "Error";
        updateDisplay();
      }
    }
    function renderHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = "";
      historyMemory.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<div class="history-expr">${item.expr}</div><div class="history-res">= ${item.res}</div>`;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function openFullHistory() {
      const container = document.getElementById('fullHistoryContainer');
      container.innerHTML = "";
      if (historyMemory.length === 0) {
        container.innerHTML = "<p style='color:#777; text-align:center;'>Sin historial registrado</p>";
      } else {
        historyMemory.forEach(item => {
          const div = document.createElement('div');
          div.style.cssText = "background:#2c2c2e; padding:10px; border-radius:10px; text-align:right;";
          div.innerHTML = `<div style="font-size:14px; color:#aaa;">${item.expr}</div><div style="font-size:18px; color:#ff9f0a; font-weight:600;">= ${item.res}</div>`;
          container.appendChild(div);
        });
      }
      openModal('fullHistoryModal');
    }

    function openModal(id) {
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById(id).classList.add('active');
    }

    function closeAllModals() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.querySelectorAll('.custom-modal').forEach(m => m.classList.remove('active'));
    }

    // HERRAMIENTAS Y CONVERSORES
    function openToolModal(type) {
      const body = document.getElementById('toolBody');
      const title = document.getElementById('toolTitle');

      if (type === 'edad') {
        title.innerText = "Calculadora de Edad";
        body.innerHTML = `
          <div class="form-group"><label>Fecha de Nacimiento</label><input type="date" id="tFecha" class="form-control"></div>
          <button class="btn-submit" onclick="calcEdad()">Calcular</button>
          <div class="tool-result-box" id="tRes">-</div>
        `;
      } else if (type === 'imc') {
        title.innerText = "Índice de Masa Corporal (IMC)";
        body.innerHTML = `
          <div class="form-group"><label>Peso (kg)</label><input type="number" id="tPeso" class="form-control" placeholder="Ej: 70"></div>
          <div class="form-group"><label>Altura (cm)</label><input type="number" id="tAltura" class="form-control" placeholder="Ej: 175"></div>
          <button class="btn-submit" onclick="calcIMC()">Calcular IMC</button>
          <div class="tool-result-box" id="tRes">-</div>
        `;
      } else if (type === 'descuento') {
        title.innerText = "Calculadora de Descuento";
        body.innerHTML = `
          <div class="form-group"><label>Precio Original ($)</label><input type="number" id="tPrecio" class="form-control"></div>
          <div class="form-group"><label>Descuento (%)</label><input type="number" id="tDesc" class="form-control"></div>
          <button class="btn-submit" onclick="calcDesc()">Calcular Final</button>
          <div class="tool-result-box" id="tRes">-</div>
        `;
      } else if (type === 'massa') {
        title.innerText = "Conversor de Masa";
        body.innerHTML = `
          <div class="form-group"><label>Kilogramos (kg)</label><input type="number" id="tKg" class="form-control"></div>
          <button class="btn-submit" onclick="calcMasa()">Convertir</button>
          <div class="tool-result-box" id="tRes">-</div>
        `;
      } else if (type === 'temperatura') {
        title.innerText = "Temperatura (°C a °F)";
        body.innerHTML = `
          <div class="form-group"><label>Grados Celsius (°C)</label><input type="number" id="tCel" class="form-control"></div>
          <button class="btn-submit" onclick="calcTemp()">Convertir</button>
          <div class="tool-result-box" id="tRes">-</div>
        `;
      } else if (type === 'sistemas') {
        title.innerText = "Sistema Numérico (Decimal a Bin/Hex)";
        body.innerHTML = `
          <div class="form-group"><label>Número Decimal</label><input type="number" id="tDec" class="form-control"></div>
          <button class="btn-submit" onclick="calcSistemas()">Convertir</button>
          <div class="tool-result-box" id="tRes">-</div>
        `;
      } else if (type === 'gst') {
        title.innerText = "Calculadora de Impuesto / GST";
        body.innerHTML = `
          <div class="form-group"><label>Monto ($)</label><input type="number" id="tMonto" class="form-control"></div>
          <div class="form-group"><label>Tasa (%)</label><input type="number" id="tTasa" class="form-control" value="16"></div>
          <button class="btn-submit" onclick="calcGST()">Calcular Con Impuesto</button>
          <div class="tool-result-box" id="tRes">-</div>
        `;
      } else {
        title.innerText = "Conversor General";
        body.innerHTML = `
          <div class="form-group"><label>Valor de Entrada</label><input type="number" id="tVal" class="form-control"></div>
          <button class="btn-submit" onclick="calcGen()">Calcular</button>
          <div class="tool-result-box" id="tRes">-</div>
        `;
      }

      openModal('toolRunnerModal');
    }
    function calcEdad() {
      const f = document.getElementById('tFecha').value;
      if (!f) return;
      const nac = new Date(f);
      const hoy = new Date();
      let edad = hoy.getFullYear() - nac.getFullYear();
      let m = hoy.getMonth() - nac.getMonth();
      if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
      document.getElementById('tRes').innerText = `${edad} Años cumplidos`;
    }

    function calcIMC() {
      const p = parseFloat(document.getElementById('tPeso').value);
      const a = parseFloat(document.getElementById('tAltura').value) / 100;
      if (!p || !a) return;
      const imc = (p / (a * a)).toFixed(2);
      let status = imc < 18.5 ? "Bajo peso" : imc < 25 ? "Normal" : "Sobrepeso";
      document.getElementById('tRes').innerText = `IMC: ${imc} (${status})`;
    }

    function calcDesc() {
      const p = parseFloat(document.getElementById('tPrecio').value);
      const d = parseFloat(document.getElementById('tDesc').value);
      if (isNaN(p) || isNaN(d)) return;
      const ahorro = (p * d) / 100;
      const total = p - ahorro;
      document.getElementById('tRes').innerText = `Pagas: $${total.toFixed(2)} (Ahorras: $${ahorro.toFixed(2)})`;
    }

    function calcMasa() {
      const kg = parseFloat(document.getElementById('tKg').value);
      if (isNaN(kg)) return;
      document.getElementById('tRes').innerText = `${(kg * 2.20462).toFixed(2)} lbs | ${(kg * 35.274).toFixed(2)} oz`;
    }

    function calcTemp() {
      const c = parseFloat(document.getElementById('tCel').value);
      if (isNaN(c)) return;
      document.getElementById('tRes').innerText = `${((c * 9/5) + 32).toFixed(2)} °F`;
    }

    function calcSistemas() {
      const d = parseInt(document.getElementById('tDec').value);
      if (isNaN(d)) return;
      document.getElementById('tRes').innerText = `BIN: ${d.toString(2)} | HEX: ${d.toString(16).toUpperCase()}`;
    }

    function calcGST() {
      const m = parseFloat(document.getElementById('tMonto').value);
      const t = parseFloat(document.getElementById('tTasa').value);
      if (isNaN(m) || isNaN(t)) return;
      const imp = (m * t) / 100;
      document.getElementById('tRes').innerText = `Total: $${(m + imp).toFixed(2)} (Impuesto: $${imp.toFixed(2)})`;
    }

    function calcGen() {
      const v = parseFloat(document.getElementById('tVal').value);
      if (isNaN(v)) return;
      document.getElementById('tRes').innerText = `Resultado: ${(v * 1.5).toFixed(2)}`;
    }

    // MÓDULO DE ACTUALIZACIÓN CON FIREBASE EN TIEMPO REAL
    function checkUpdates() {
      const label = document.getElementById('appVersionLabel');
      label.innerText = "Buscando...";

      const versionRef = database.ref('version_info/latestVersion');

      versionRef.once('value')
        .then((snapshot) => {
          const latestVersion = snapshot.val();
          label.innerText = `v${APP_VERSION} (Última)`;

          if (!latestVersion) {
            alert("No se pudo obtener la información de la versión desde la base de datos.");
            return;
          }

          if (isNewerVersion(latestVersion, APP_VERSION)) {
            const userChoice = confirm(`¡Nueva versión disponible (v${latestVersion})!\n\n¿Deseas ir a Google Play para descargarla ahora?`);
            if (userChoice) {
              window.open(PLAY_STORE_URL, "_blank");
            }
          } else {
            alert(`¡Tu calculadora ya está actualizada a la versión más reciente (v${APP_VERSION})!`);
          }
        })
        .catch((error) => {
          console.error("Error al consultar Firebase:", error);
          label.innerText = `v${APP_VERSION} (Última)`;
          alert("Error al conectar con el servidor de actualizaciones.");
        });
    }

    // COMPARADOR AUXILIAR DE VERSIONES (X.Y.Z)
    function isNewerVersion(latest, current) {
      const vLatest = latest.split('.').map(Number);
      const vCurrent = current.split('.').map(Number);

      for (let i = 0; i < Math.max(vLatest.length, vCurrent.length); i++) {
        const num1 = vLatest[i] || 0;
        const num2 = vCurrent[i] || 0;

        if (num1 > num2) return true;
        if (num1 < num2) return false;
      }
      return false;
    }

    // PERSONALIZACIÓN DE FONDO
    function uploadBackground(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('appContainer').style.backgroundImage = `url('${e.target.result}')`;
          localStorage.setItem('calc_custom_bg', e.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    function changeOverlayOpacity(val) {
      document.getElementById('bgOverlay').style.background = `rgba(0, 0, 0, ${val})`;
      localStorage.setItem('calc_bg_opacity', val);
    }

    function resetCustomization() {
      document.getElementById('appContainer').style.backgroundImage = 'none';
      document.getElementById('bgOverlay').style.background = 'rgba(0, 0, 0, 0.85)';
      localStorage.removeItem('calc_custom_bg');
      localStorage.removeItem('calc_bg_opacity');
    }

    window.onload = function() {
      const savedBg = localStorage.getItem('calc_custom_bg');
      const savedOpacity = localStorage.getItem('calc_bg_opacity');
      if (savedBg) document.getElementById('appContainer').style.backgroundImage = `url('${savedBg}')`;
      if (savedOpacity) document.getElementById('bgOverlay').style.background = `rgba(0, 0, 0, ${savedOpacity})`;
    };
  </script>
</body>
</html>
